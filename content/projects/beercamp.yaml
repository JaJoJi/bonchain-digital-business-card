name: Beercamp
kind: event
summary: >-
  A networking night for the tech and developer community in Hat Yai, hosted
  by Bonchain right after BarCamp Songkhla 10.
description: >-
  Held on 28 February 2026. After a day of talks on the BarCamp Songkhla
  stage, builders, students and developers kept the conversation going over
  food and drinks. Meet. Share. Connect.
